[project]
name = "intent-classification"
version = "0.1.0"
description = "Banking intent classification with LLM-based experiments"
readme = "README.md"

requires-python = ">=3.11,<3.13"

dependencies = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0.0",
    "ipykernel>=6.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=3.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "langchain-ollama>=1.1.0",
    "pydantic>=2.12.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "datasets>=2.0.0",
    "trl>=0.8.0",
    "peft>=0.10.0",
    "outlines>=1.3.0",
    "bitsandbytes>=0.49.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    ".ipynb_checkpoints",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]
extend-select = [
    "UP",    # pyupgrade (modern Python syntax)
    "C4",    # flake8-comprehensions
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
]

[tool.ruff.lint.isort]
lines-after-imports = 2
combine-as-imports = false
split-on-trailing-comma = false
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
skip-magic-trailing-comma = true
